components:
  securitySchemes:
    AdminAuth:
      type: http
      scheme: bearer
      bearerFormat: >
        Pluggable. The admin server does not implement authentication itself;
        it delegates every request under /tenants/ to a caller-supplied
        AdminAuthFunc (func(*http.Request) error) installed via
        WithAdminAuth(). Typical implementations validate a bearer JWT (see
        TokenConfig/TokenPair) or an API key header. Document the concrete
        scheme your deployment uses (Authorization: Bearer <token>,
        X-API-Key: <key>, mTLS, etc.) here for your generated clients. If no
        AdminAuthFunc is configured, the server logs a warning and allows all
        requests — do not run that configuration in production. /auth/login,
        /auth/refresh and /auth/logout are NOT covered by AdminAuthFunc.
      description: >
        Bearer token or API key, enforced by the caller-supplied AdminAuthFunc.
        See bearerFormat for details.

  parameters:
    TenantPath:
      name: tenant
      in: path
      required: true
      description: Tenant id
      schema:
        type: string
    IDPath:
      name: id
      in: path
      required: true
      description: Resource id
      schema:
        type: string

  responses:
    BadRequest:
      description: Malformed request body or missing required field
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: AdminAuthFunc rejected the request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server-side error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotImplemented:
      description: The corresponding store (e.g. UserStore, GroupStore, ...) was not configured on the ExtendedAdminServer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Effect:
      type: string
      enum: [allow, deny]

    Action:
      type: string
      description: Free-form action identifier, e.g. "read", "write", "route:GET:/users/1".

    UserStatus:
      type: string
      enum: [active, suspended, deactivated]

    InviteStatus:
      type: string
      enum: [pending, accepted, expired, revoked]

    EventType:
      type: string
      enum:
        - user.created
        - user.updated
        - user.deleted
        - user.suspended
        - user.login
        - user.login_failed
        - role.assigned
        - role.revoked
        - policy.created
        - policy.updated
        - policy.deleted
        - acl.granted
        - acl.revoked
        - invite.sent
        - invite.accepted
        - group.created
        - group.member_added
        - group.member_removed
        - apikey.created
        - apikey.revoked

    Tenant:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        parent_id:
          type: [string, "null"]
        attrs:
          type: [object, "null"]
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id]

    PolicyPayload:
      type: object
      description: Request body for creating/updating a policy.
      properties:
        id:
          type: string
          description: Optional; server generates one (prefixed "policy_") if omitted on create.
        effect:
          $ref: "#/components/schemas/Effect"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/Action"
          minItems: 1
        resources:
          type: array
          items:
            type: string
            description: Resource pattern, e.g. "document:*" or "file:123"
          minItems: 1
        condition:
          type: string
          description: Condition expression string parsed by the policy condition language; empty string means no condition.
        priority:
          type: integer
          description: Higher values are evaluated first.
        enabled:
          type: [boolean, "null"]
          description: Defaults to true if omitted.
      required: [effect, actions, resources]

    PolicyDTO:
      type: object
      description: Response shape for policy read/write endpoints.
      properties:
        id:
          type: string
        tenant_id:
          type: string
        effect:
          $ref: "#/components/schemas/Effect"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/Action"
        resources:
          type: array
          items:
            type: string
        condition:
          type: string
          description: Stringified condition expression (empty string if none).
        priority:
          type: integer
        enabled:
          type: boolean
        version:
          type: integer
        updated_at:
          type: string
          format: date-time

    Permission:
      type: object
      properties:
        action:
          $ref: "#/components/schemas/Action"
        resource:
          type: string
          description: Resource pattern, e.g. "document:*"
      required: [action, resource]

    RolePayload:
      type: object
      description: Request body for creating/updating a role.
      properties:
        id:
          type: string
          description: Optional; server generates one (prefixed "role_") if omitted on create.
        name:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        inherits:
          type: array
          items:
            type: string
          description: Role ids this role inherits permissions from.
        owner_allowed_actions:
          type: array
          items:
            $ref: "#/components/schemas/Action"

    RoleDTO:
      type: object
      description: Response shape for role read/write endpoints.
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        inherits:
          type: array
          items:
            type: string
        owner_allowed_actions:
          type: array
          items:
            $ref: "#/components/schemas/Action"

    ACL:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        resource_id:
          type: string
        subject_id:
          type: string
        actions:
          type: array
          items:
            $ref: "#/components/schemas/Action"
        effect:
          $ref: "#/components/schemas/Effect"
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Zero value means no expiry.
        created_at:
          type: string
          format: date-time
      required: [resource_id, subject_id, actions, effect]

    Subject:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          description: e.g. "user", "service", "device"
        tenant_id:
          type: string
        roles:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string
        attrs:
          type: [object, "null"]
          additionalProperties: true
      required: [id]

    Resource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        tenant_id:
          type: string
        owner_id:
          type: string
        attrs:
          type: [object, "null"]
          additionalProperties: true
      required: [id, type]

    Environment:
      type: object
      properties:
        time:
          type: string
          format: date-time
        ip:
          type: [string, "null"]
        tenant_id:
          type: string
        region:
          type: string
        extra:
          type: [object, "null"]
          additionalProperties: true

    ExplainRequest:
      type: object
      properties:
        tenant:
          type: string
          description: Defaults to the tenant from the path if omitted.
        subject_id:
          type: string
        roles:
          type: array
          items:
            type: string
        action:
          $ref: "#/components/schemas/Action"
        resource:
          type: string
          description: Format "type:id" (e.g. "document:42") or a route key (e.g. "route:GET:/users/1").
        owner_id:
          type: string
      required: [subject_id, action, resource]

    Decision:
      type: object
      properties:
        allowed:
          type: boolean
        reason:
          type: string
        matched_by:
          type: string
          description: e.g. "policy_id", "acl", "role"
        trace:
          type: array
          items:
            type: string
        timestamp:
          type: string
          format: date-time

    AuthRequest:
      type: object
      properties:
        subject:
          $ref: "#/components/schemas/Subject"
        action:
          $ref: "#/components/schemas/Action"
        resource:
          $ref: "#/components/schemas/Resource"
        environment:
          anyOf:
            - $ref: "#/components/schemas/Environment"
            - type: "null"
      required: [subject, action, resource]

    BatchAuthorizeRequest:
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/AuthRequest"
          minItems: 1
      required: [requests]

    BatchAuthorizeResponse:
      type: object
      properties:
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/Decision"

    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          format: int64
          description: Access token TTL in seconds.
        token_type:
          type: string
          example: Bearer

    User:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        status:
          $ref: "#/components/schemas/UserStatus"
        email_verified:
          type: boolean
        mfa_enabled:
          type: boolean
        attrs:
          type: [object, "null"]
          additionalProperties: true
        last_login_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [email]

    Group:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        description:
          type: string
        parent_id:
          type: [string, "null"]
          description: For nested groups.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Scope:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
          description: e.g. "read:documents", "admin:users"
        description:
          type: string
        parent_id:
          type: [string, "null"]
          description: For hierarchical scopes.
        created_at:
          type: string
          format: date-time

    ServiceAccount:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        description:
          type: string
        client_id:
          type: string
          readOnly: true
        status:
          $ref: "#/components/schemas/UserStatus"
        roles:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        created_by:
          type: string
        last_used_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: client_secret is never serialized (write-only hash internally); it is only exposed via ServiceAccountCreateResponse at creation time.

    ServiceAccountCreateResponse:
      type: object
      properties:
        service_account:
          $ref: "#/components/schemas/ServiceAccount"
        client_id:
          type: string
        client_secret:
          type: string
          description: Plaintext secret, shown once. Store it now; it cannot be retrieved again.

    Invitation:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        email:
          type: string
          format: email
        role_ids:
          type: array
          items:
            type: string
        group_ids:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/InviteStatus"
        invited_by:
          type: string
          description: User id of the inviter.
        message:
          type: string
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        accepted_at:
          type: [string, "null"]
          format: date-time
      required: [email]

    InvitationCreateResponse:
      type: object
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        token:
          type: string
          description: Plaintext invite token, shown once. Only its hash is stored server-side.

    Webhook:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventType"
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [url]
      description: The webhook signing secret is never serialized.

    Event:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        type:
          $ref: "#/components/schemas/EventType"
        actor_id:
          type: string
        target_id:
          type: [string, "null"]
        data:
          type: [object, "null"]
          additionalProperties: true
        timestamp:
          type: string
          format: date-time

    EffectivePermission:
      type: object
      properties:
        action:
          $ref: "#/components/schemas/Action"
        resource:
          type: string
        effect:
          $ref: "#/components/schemas/Effect"
        source:
          type: string
          description: e.g. "role:admin", "acl:acl-123", "policy:pol-456", "group:eng"
