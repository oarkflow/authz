openapi: 3.1.0
info:
  title: authz Admin HTTP API
  version: "1.0.0"
  description: |
    Machine-readable specification for the admin/control-plane HTTP API exposed by
    `authz.AdminHTTPServer` (base endpoints) and `authz.ExtendedAdminServer` (IAM and
    operational endpoints).

    This spec was generated by reading the handler implementations in
    `authz_admin.go` and `authz_admin_ext.go` directly (not just the README), so
    request/response shapes reflect actual server behavior, including two notable
    quirks:

    - `GET /tenants/{tenant}/policies/{id}` and `GET /tenants/{tenant}/roles/{id}`
      are **not implemented** — only list (no id in the path) is supported for GET;
      an id in the path on GET returns `404`. Only `PUT`/`DELETE` accept an id.
    - There is no dedicated `POST .../policies/{id}/enable` or `.../disable`
      endpoint in the current handler code (despite being mentioned in some
      docs). Toggling a policy's `enabled` flag is done via `PUT
      /tenants/{tenant}/policies/{id}` with `enabled` set in the request body.

    All routes registered under `/tenants/` require authentication as configured
    via `AdminAuthFunc` (see the `AdminAuth` security scheme below). `/auth/*`
    endpoints are not tenant-scoped and are not gated by `AdminAuthFunc`.
  license:
    name: Unlicensed / see repository LICENSE
servers:
  - url: http://localhost:8081
    description: Example local admin server address (configurable via AdminHTTPServer.Start)

security:
  - AdminAuth: []

tags:
  - name: System
  - name: Tenants
  - name: Policies
  - name: Roles
  - name: ACLs
  - name: Members
  - name: Decisions
  - name: Auth
  - name: Users
  - name: Groups
  - name: Scopes
  - name: Service Accounts
  - name: Invitations
  - name: Webhooks
  - name: Events
  - name: Effective Permissions

paths:
  /healthz:
    get:
      tags: [System]
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /tenants:
    get:
      tags: [Tenants]
      summary: List all tenants
      responses:
        "200":
          description: List of tenants
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenants:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tenant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Tenants]
      summary: Create a tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Tenant"
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          description: Missing tenant id, or malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /tenants/{tenant}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      tags: [Tenants]
      summary: Get a tenant by id
      responses:
        "200":
          description: Tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Tenants]
      summary: Update a tenant (full replace; id is taken from the path)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Tenant"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Tenants]
      summary: Delete a tenant
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /tenants/{tenant}/policies:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      tags: [Policies]
      summary: List policies for a tenant
      responses:
        "200":
          description: List of policies
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies:
                    type: array
                    items:
                      $ref: "#/components/schemas/PolicyDTO"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Policies]
      summary: Create a policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyPayload"
      responses:
        "201":
          description: Created policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDTO"
        "400":
          description: Validation error (e.g. missing actions/resources, bad condition expression)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /tenants/{tenant}/policies/{id}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/IDPath"
    put:
      tags: [Policies]
      summary: Update a policy (also used to enable/disable via the `enabled` field)
      description: >
        There is no separate enable/disable endpoint. Set `enabled: true|false`
        in the request body to toggle a policy's active state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyPayload"
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Policies]
      summary: Delete a policy
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /tenants/{tenant}/roles:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      tags: [Roles]
      summary: List roles for a tenant
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoleDTO"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Roles]
      summary: Create a role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolePayload"
      responses:
        "201":
          description: Created role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /tenants/{tenant}/roles/{id}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/IDPath"
    put:
      tags: [Roles]
      summary: Update a role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolePayload"
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Roles]
      summary: Delete a role
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /tenants/{tenant}/acls:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      tags: [ACLs]
      summary: List ACLs for a tenant
      responses:
        "200":
          description: List of ACLs
          content:
            application/json:
              schema:
                type: object
                properties:
                  acls:
                    type: array
                    items:
                      $ref: "#/components/schemas/ACL"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [ACLs]
      summary: Create (grant) an ACL entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ACL"
      responses:
        "201":
          description: Created ACL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ACL"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /tenants/{tenant}/acls/{id}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/IDPath"
    get:
      tags: [ACLs]
      summary: Get a single ACL entry
      responses:
        "200":
          description: ACL entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ACL"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not found, or found but belongs to a different tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [ACLs]
      summary: Update (replace) an ACL entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ACL"
      responses:
        "200":
          description: Updated ACL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ACL"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [ACLs]
      summary: Revoke (delete) an ACL entry
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /tenants/{tenant}/members/{subject}/roles:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - name: subject
        in: path
        required: true
        description: Subject (user) id
        schema:
          type: string
    get:
      tags: [Members]
      summary: List role ids assigned to a subject
      responses:
        "200":
          description: List of role ids
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Members]
      summary: Assign a role to a subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id:
                  type: string
      responses:
        "201":
          description: Role assigned (empty body)
        "400":
          description: Missing role_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /tenants/{tenant}/members/{subject}/roles/{role}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - name: subject
        in: path
        required: true
        description: Subject (user) id
        schema:
          type: string
      - name: role
        in: path
        required: true
        description: Role id to revoke
        schema:
          type: string
    delete:
      tags: [Members]
      summary: Revoke a role from a subject
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /tenants/{tenant}/explain:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    post:
      tags: [Decisions]
      summary: Explain an authorization decision (with trace)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplainRequest"
      responses:
        "200":
          description: Decision with explanation trace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /tenants/{tenant}/batch:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    post:
      tags: [Decisions]
      summary: Evaluate multiple authorization requests in one call
      description: >
        For each request, `subject.tenant_id`, `resource.tenant_id`, and
        `environment.tenant_id` default to the tenant in the path when omitted.
        `environment` defaults to the current time when omitted entirely.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchAuthorizeRequest"
      responses:
        "200":
          description: Decisions, one per request, in order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchAuthorizeResponse"
        "400":
          description: Empty requests array, or a request missing subject/resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with tenant, email and password
      security: []
      description: >
        Not gated by AdminAuthFunc. Requires a UserStore and TokenConfig to be
        configured on the ExtendedAdminServer, otherwise 501.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, email, password]
              properties:
                tenant_id:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Access/refresh token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Account not active (suspended/deactivated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Account temporarily locked due to repeated failed attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          description: Auth not configured (missing UserStore/TokenConfig)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: New access/refresh token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Auth not configured (missing TokenConfig)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out (delete a session, or all sessions for a user)
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                  description: If set, deletes this specific session.
                user_id:
                  type: string
                  description: If session_id is empty and this is set, deletes all sessions for the user.
      responses:
        "204":
          description: Logged out (best-effort; no error if session store is not configured)
        "400":
          $ref: "#/components/responses/BadRequest"

  /tenants/{tenant}/users:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      tags: [Users]
      summary: List users in a tenant
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      tags: [Users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Missing email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /tenants/{tenant}/users/{id}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/IDPath"
    get:
      tags: [Users]
      summary: Get a user by id
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    put:
      tags: [Users]
      summary: Update a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      tags: [Users]
      summary: Delete a user
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /tenants/{tenant}/groups:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      tags: [Groups]
      summary: List groups in a tenant
      responses:
        "200":
          description: List of groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      tags: [Groups]
      summary: Create a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Group"
      responses:
        "201":
          description: Created group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /tenants/{tenant}/groups/{group}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - name: group
        in: path
        required: true
        description: Group id
        schema:
          type: string
    get:
      tags: [Groups]
      summary: Get a group by id
      responses:
        "200":
          description: Group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    put:
      tags: [Groups]
      summary: Update a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Group"
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      tags: [Groups]
      summary: Delete a group
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /tenants/{tenant}/groups/{group}/members:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - name: group
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Groups]
      summary: List member user ids of a group
      responses:
        "200":
          description: List of user ids
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      tags: [Groups]
      summary: Add a user to a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
      responses:
        "201":
          description: Added (empty body)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"

